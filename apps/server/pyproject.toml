[project]
name = "grade-server"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "yt-dlp>=2025.1.26",
  "librosa>=0.10",
  "numpy",
  "soundfile",
  "openai>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
markers = ["live: hits the network (YouTube); skipped by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
